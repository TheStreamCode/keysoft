# Dependency updates. Keysoft is installed with Bun and the repository uses GitHub Actions.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      bun-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Expo packages are versioned by the installed Expo SDK; a major bump on a
      # single package would break the SDK alignment that expo-doctor enforces.
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      # Same reason for the packages the SDK pins to an exact version: expo-doctor
      # compares them by patch too, so every update type has to go through
      # `npx expo install` rather than a Dependabot bump.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "react-native"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-worklets"
      - dependency-name: "@react-native-community/slider"
      # Babel 8 is a breaking major for the Jest transform; migrate deliberately.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      # ESLint 10 has no support in eslint-plugin-react yet.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # AsyncStorage 3 removed multiGet/multiSet; migrate deliberately.
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: ["version-update:semver-major"]

