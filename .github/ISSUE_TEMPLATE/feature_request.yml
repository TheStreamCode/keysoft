name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed change.
        Large features usually need a discussion before an implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Desired behavior, alternatives considered, and what it must not break.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security and privacy impact
      description: Does this change authentication, cryptography, storage, backups, permissions, network behavior, notifications, or user-visible privacy text?
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for this proposal.
          required: true
