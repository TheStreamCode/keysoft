name: Build Android production

# Release-oriented triggers to conserve EAS build credits (free tier):
# - push a version tag (e.g. v3.3.1) to build that release, or
# - run it manually from the Expo dashboard ("Run workflow") / `eas workflow:run`.
# Intentionally NOT triggered on every push to main, to avoid burning build minutes.
on:
  push:
    tags:
      - v*
  workflow_dispatch: {}

jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit to Google Play
    needs: [build_android]
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
    hooks:
      after_submit:
        - name: Publish Play Store release notes
          run: |
            set -euo pipefail
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_SERVICE_ACCOUNT_KEY_PATH"
            chmod 600 "$GOOGLE_SERVICE_ACCOUNT_KEY_PATH"
            node scripts/play-release-notes.mjs
